<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Employee Hours Tracker"
>

<title>Employee Hours Tracker</title>

<link
    rel="stylesheet"
    href="./css/main.css"
>

<link
    rel="manifest"
    href="/manifest.webmanifest"
>

<link
    rel="icon"
    type="image/png"
    href="/assets/icons/icon-192.png"
>

</head>

<body>

<!-- Navigation -->
<nav class="navbar">

    <a href="#home">
        الرئيسية
    </a>

    <a href="#attendance">
        أيام الحضور
    </a>

</nav>


<!-- Main Application -->
<main class="container">

    <!-- Home / Work Session -->
    <section
        id="home"
        class="card"
    >

        <h1>
            تسجيل حضور الشيف ابو رقية
        </h1>

        <form id="work-session-form">

            <!-- =========================
                 Dev 3 - Current Date
                 ========================= -->

            <div class="form-group">

                <label for="work-date">
                    Work Date
                </label>

                <input
                    type="date"
                    id="work-date"
                    name="date"
                    readonly
                >

                <span id="date-display"></span>

            </div>


            <!-- =========================
                 Dev 1 - Arrival Time
                 ========================= -->

            <div class="form-group">

                <label>
                    وقت الحضور
                </label>

                <div id="start-time-display" class="time-display">
                    لم يتم التسجيل
                </div>

                <button
                    type="button"
                    id="record-start-time"
                    class="secondary-button"
                >
                    تسجيل وقت الحضور
                </button>

                <input
                    type="hidden"
                    id="start-time"
                    name="startTime"
                >

            </div>


            <!-- =========================
                 Dev 2 - Leaving Time
                 ========================= -->

            <div class="form-group">

                <label>
                    وقت الانصراف
                </label>

                <div id="end-time-display" class="time-display">
                    لم يتم التسجيل
                </div>

                <button
                    type="button"
                    id="record-end-time"
                    class="secondary-button"
                    disabled
                >
                    تسجيل وقت الانصراف
                </button>

                <input
                    type="hidden"
                    id="end-time"
                    name="endTime"
                >

            </div>

            <div id="session-duration-display" class="session-summary">
                إجمالي الساعات: لم يتم الحساب
            </div>


            <!-- =========================
                 Dev 4 - Submit
                 ========================= -->

            <button
                type="submit"
                id="submit-work-session"
                disabled
            >
                حفظ
            </button>

        </form>

    </section>


    <!-- =========================
         Attendance / أيام الحضور
         ========================= -->

    <section
        id="attendance"
        class="attendance-section"
    >

        <div class="attendance-header">

            <div>

                <span class="section-label">
                    سجل العمل
                </span>

                <h2>
                    أيام الحضور
                </h2>

                <p>
                    سجل جميع أيام وساعات العمل
                </p>

            </div>

        </div>


        <!-- Attendance Table -->

        <div class="attendance-card">

            <div class="table-wrapper">

                <table class="attendance-table">

                    <thead>

                        <tr>
                            <th>اليوم</th>
                            <th>وقت الحضور</th>
                            <th>وقت الانصراف</th>
                            <th>إجمالي الساعات</th>
                            <th>الإجراء</th>
                        </tr>

                    </thead>

                    <tbody
                        id="attendance-table-body"
                    >
                        <!--
                            attendanceUI.js
                            will insert rows here.
                        -->
                    </tbody>

                </table>

            </div>

        </div>


        <!-- Total Hours -->

        <div class="total-hours-card">

            <div class="total-hours-icon">
                ⏱
            </div>

            <div class="total-hours-content">

                <span>
                    إجمالي ساعات العمل
                </span>

                <strong id="total-hours-value">
                    —
                </strong>

            </div>

            <button
                type="button"
                id="show-total-hours"
                class="total-hours-button"
            >
                عرض الإجمالي
            </button>

        </div>


        <!-- Earnings / Hourly Rate -->

        <div class="earnings-card">

            <div class="earnings-icon">
                💰
            </div>

            <div class="earnings-content">

                <div class="earnings-content-row">
                    <span>سعر الساعة (ج.م)</span>
                    <input
                        type="number"
                        id="hourly-rate-input"
                        class="hourly-rate-input"
                        min="0"
                        placeholder="100"
                    >
                </div>

                <div class="earnings-content-row" style="margin-top: 0.5rem;">
                    <span>الأرباح المتوقعة</span>
                    <strong id="estimated-earnings-value">
                        —
                    </strong>
                </div>

            </div>

        </div>

    </section>

</main>


<!-- Application Entry Point -->

<script type="module" src="js/main.js"></script>

</body>

</html>
