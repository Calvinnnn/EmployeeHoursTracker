<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Employee Hours Tracker"
    >

    <title>Employee Hours Tracker</title>

    <link
        rel="stylesheet"
        href="./css/main.css"
    >
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Employee Hours Tracker</h1>

            <form id="work-session-form">

                <!-- Dev 3 -->
                <div class="form-group">

                    <label>Work Date</label>

                    <input
                        type="date"
                        id="work-date"
                        name="date"
                        readonly
                    >

                    <span id="date-display"></span>

                </div>


                <!-- Dev 1 -->
                <div class="form-group">

                    <label for="start-time">
                        Arrival Time
                    </label>

                    <input
                        type="time"
                        id="start-time"
                        name="startTime"
                        required
                    >

                </div>


                <!-- Dev 2 -->
                <div class="form-group">

                    <label for="end-time">
                        Leaving Time
                    </label>

                    <input
                        type="time"
                        id="end-time"
                        name="endTime"
                        required
                    >

                </div>


                <!-- Dev 4 -->
                <button
                    type="submit"
                    id="submit-work-session"
                >
                    Save Work Session
                </button>

            </form>

        </section>

    </main>

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
